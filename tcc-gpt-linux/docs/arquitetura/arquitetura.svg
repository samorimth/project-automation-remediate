<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <rect width="1200" height="860" fill="#ffffff"/>
  <style>
    text { font-family: "Liberation Sans", Arial, sans-serif; fill: #1a1a1a; }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 12px; }
    .box { fill: #f7f7f4; stroke: #222; stroke-width: 1.4; }
    .hist { fill: #f4efe6; stroke: #222; stroke-width: 1.4; }
    .plan { fill: #e7f0ea; stroke: #222; stroke-width: 1.4; }
  </style>
  <text x="40" y="36" class="title">Arquitetura do laboratório — CVE-2024-38428</text>
  <text x="40" y="58" class="s">Fundo branco para inclusão no TCC. O lado esquerdo é o que já foi executado. O lado direito ainda não foi executado.</text>

  <rect x="40" y="80" width="1120" height="150" rx="8" class="box"/>
  <text x="60" y="104" class="h">Caminho comum, já usado na geração dos três scripts</text>
  <rect x="60" y="120" width="150" height="78" rx="6" class="box"/><text x="78" y="154" class="b">Cursor</text><text x="78" y="174" class="s">edição local</text>
  <rect x="240" y="120" width="170" height="78" rx="6" class="box"/><text x="258" y="154" class="b">Aplicação Python</text><text x="258" y="174" class="s">pipeline do laboratório</text>
  <rect x="440" y="120" width="170" height="78" rx="6" class="box"/><text x="458" y="154" class="b">API OpenAI</text><text x="458" y="174" class="s">uma chamada por script</text>
  <rect x="640" y="120" width="150" height="78" rx="6" class="box"/><text x="658" y="154" class="b">Modelo GPT</text><text x="658" y="174" class="s">metadado gravado</text>
  <rect x="820" y="120" width="300" height="78" rx="6" class="box"/><text x="838" y="148" class="b">Validação estática</text><text x="838" y="168" class="s">bash -n, ShellCheck e checklist</text><text x="838" y="186" class="s">Revisão de segurança antes do SSM</text>
  <polygon points="210,159 240,159 230,154 240,159 230,164" fill="#222"/>
  <line x1="210" y1="159" x2="240" y2="159" stroke="#222" stroke-width="1.4"/>
  <line x1="410" y1="159" x2="440" y2="159" stroke="#222" stroke-width="1.4"/>
  <line x1="610" y1="159" x2="640" y2="159" stroke="#222" stroke-width="1.4"/>
  <line x1="790" y1="159" x2="820" y2="159" stroke="#222" stroke-width="1.4"/>

  <rect x="40" y="260" width="540" height="520" rx="8" class="hist"/>
  <text x="60" y="288" class="h">Histórico — uma EC2 reutilizada</text>
  <text x="60" y="310" class="s">Executado em us-east-2 e depois destruído.</text>
  <rect x="70" y="330" width="480" height="52" rx="6" class="box"/><text x="88" y="352" class="b">Terraform: VPC, NAT e Systems Manager</text><text x="88" y="370" class="s">Infraestrutura compartilhada da tentativa 5</text>
  <rect x="70" y="400" width="480" height="52" rx="6" class="box"/><text x="88" y="422" class="b">AMI pública da Canonical</text><text x="88" y="440" class="s">ami-096d6538c463eb1db — não é AMI privada de referência</text>
  <rect x="70" y="470" width="480" height="64" rx="6" class="box"/><text x="88" y="494" class="b">Uma EC2 Ubuntu 24.04</text><text x="88" y="514" class="s">i-04da3315297ec6c04 executou os três scripts</text>
  <rect x="70" y="552" width="480" height="52" rx="6" class="box"/><text x="88" y="574" class="b">prepare.sh --apply na mesma EC2</text><text x="88" y="592" class="s">Repetições 3 e 4; a repetição 2 não usou esse passo</text>
  <rect x="70" y="622" width="480" height="52" rx="6" class="box"/><text x="88" y="644" class="b">Verificação independente por dpkg</text><text x="88" y="662" class="s">Sem teste funcional do wget e sem scanner</text>
  <rect x="70" y="692" width="480" height="52" rx="6" class="box"/><text x="88" y="714" class="b">Destruição da pilha inteira</text><text x="88" y="732" class="s">14 itens com ok=true; evidências ficaram fora da instância</text>

  <rect x="620" y="260" width="540" height="520" rx="8" class="plan"/>
  <text x="640" y="288" class="h">Padrão atual — EC2 nova por script</text>
  <text x="640" y="310" class="s">Usado na reexecução do wget em 12/11/2026. A segunda CVE ainda não rodou.</text>
  <rect x="650" y="330" width="480" height="52" rx="6" class="box"/><text x="668" y="352" class="b">Terraform: VPC e Systems Manager</text><text x="668" y="370" class="s">Permanece entre as repetições; não é destruído a cada script</text>
  <rect x="650" y="400" width="480" height="52" rx="6" class="box"/><text x="668" y="422" class="b">AMI privada de referência</text><text x="668" y="440" class="s">Ubuntu 24.04 e wget 1.21.4-1ubuntu4; AMI ami-03629c5c47c71759b</text>
  <rect x="650" y="470" width="480" height="64" rx="6" class="box"/><text x="668" y="494" class="b">EC2 nova para um único script</text><text x="668" y="514" class="s">Mesma AMI, uma instância por vez, instance_id novo</text>
  <rect x="650" y="552" width="480" height="52" rx="6" class="box"/><text x="668" y="574" class="b">before.json e after.json</text><text x="668" y="592" class="s">dpkg e teste funcional local do wget, sem explorar a CVE</text>
  <rect x="650" y="622" width="480" height="52" rx="6" class="box"/><text x="668" y="644" class="b">Coleta de evidências e destruição da EC2</text><text x="668" y="662" class="s">Só a instância daquela repetição sai; a AMI permanece</text>
  <rect x="650" y="692" width="480" height="52" rx="6" class="box"/><text x="668" y="714" class="b">Relatórios</text><text x="668" y="732" class="s">CSV, JSON e gráficos, separados do conjunto histórico</text>
</svg>
